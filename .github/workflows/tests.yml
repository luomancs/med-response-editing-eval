name: Regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  factuality:
    # Keep Python 3.9 available when ubuntu-latest advances.
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install numpy pandas tqdm
      - run: python -m unittest discover -s tests -v
      - run: bash -n factuality_score/run_example.sh
